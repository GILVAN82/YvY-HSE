<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#32d1c2"/></marker><style>.t{font:700 30px Arial;fill:#eef7ff}.s{font:500 22px Arial;fill:#b7cadd}.b{fill:#11263d;stroke:#2e6f9e;stroke-width:3;rx:18}.g{fill:#123d43;stroke:#32d1c2;stroke-width:3;rx:18}.l{stroke:#32d1c2;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#081727"/><text x="70" y="70" class="t" font-size="44">Controlled Long-Term Memory</text>
<rect class="g" x="70" y="150" width="270" height="100"/><text class="t" x="105" y="195">“Remember that…”</text><text class="s" x="105" y="228">explicit user intent</text><path class="l" d="M340 200H410"/><rect class="b" x="420" y="150" width="260" height="100"/><text class="t" x="475" y="210">Validate</text><path class="l" d="M680 200H750"/><rect class="b" x="760" y="140" width="330" height="120"/><text class="t" x="795" y="190">Allowed Category</text><text class="s" x="800" y="225">no secrets / personal data</text><path class="l" d="M1090 200H1160"/><rect class="g" x="1170" y="150" width="340" height="100"/><text class="t" x="1225" y="195">PostgreSQL Memory</text><text class="s" x="1230" y="228">idempotent + updateable</text>
<path class="l" d="M1340 250V390H1050"/><rect class="b" x="720" y="350" width="320" height="100"/><text class="t" x="805" y="410">New Thread</text><path class="l" d="M720 400H650"/><rect class="g" x="280" y="350" width="360" height="100"/><text class="t" x="325" y="395">Relevant Retrieval</text><text class="s" x="350" y="428">max 3 items</text>
<path class="l" d="M460 450V590"/><rect class="b" x="280" y="600" width="360" height="100"/><text class="t" x="405" y="660">Forget</text><path class="l" d="M640 650H790"/><rect class="g" x="800" y="600" width="510" height="100"/><text class="t" x="865" y="645">Disabled → no later retrieval</text><text class="s" x="900" y="680">normal conversation was never saved</text>
</svg>
