<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font:700 34px Arial;fill:#eef7ff}.s{font:500 24px Arial;fill:#b7cadd}.k{font:700 25px Arial;fill:#32d1c2}.b{fill:#11263d;stroke:#2e6f9e;stroke-width:3;rx:24}</style><rect width="1600" height="900" fill="#081727"/><text x="70" y="70" class="t" font-size="44">Three Contexts, Three Different Jobs</text>
<rect class="b" x="70" y="150" width="450" height="610"/><text class="t" x="245" y="220">RAG</text><text class="k" x="135" y="285">Reference HSE knowledge</text><text class="s" x="120" y="355">• Approved documents</text><text class="s" x="120" y="405">• Semantic retrieval</text><text class="s" x="120" y="455">• Citations + jurisdiction</text><text class="s" x="120" y="535">Examples</text><text class="s" x="120" y="580">LOTO · PTW · Risk · Emergency</text><text class="k" x="120" y="690">Not conversation memory</text>
<rect class="b" x="575" y="150" width="450" height="610"/><text class="t" x="690" y="220">THREAD STATE</text><text class="k" x="655" y="285">Current conversation continuity</text><text class="s" x="625" y="355">• One thread UUID</text><text class="s" x="625" y="405">• Last 30 messages</text><text class="s" x="625" y="455">• PostgreSQL persistence</text><text class="s" x="625" y="535">Purpose</text><text class="s" x="625" y="580">Follow-up and isolation</text><text class="k" x="625" y="690">Not durable preference</text>
<rect class="b" x="1080" y="150" width="450" height="610"/><text class="t" x="1135" y="220">LONG-TERM MEMORY</text><text class="k" x="1140" y="285">Explicit durable context</text><text class="s" x="1130" y="355">• “Remember that…” only</text><text class="s" x="1130" y="405">• Allowed categories</text><text class="s" x="1130" y="455">• Cross-thread retrieval</text><text class="s" x="1130" y="535">Lifecycle</text><text class="s" x="1130" y="580">Save · Update · Forget</text><text class="k" x="1130" y="690">Normal chat is not saved</text>
</svg>
